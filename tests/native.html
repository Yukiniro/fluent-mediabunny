<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>fluent-mediabunny native file validation</title>
  <body>
    <h1>Native file commit validation</h1>
    <p>
      Select only a dedicated native-output.mp4 test file. This check replaces its contents, then
      verifies that cancellation preserves the committed result.
    </p>
    <button id="start">Select test file and validate</button>
    <pre id="result">Waiting for a file</pre>
    <script type="module">
      import { media, probe } from "/src/index.ts";
      document.querySelector("#start").onclick = async () => {
        const el = document.querySelector("#result");
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: "native-output.mp4",
            types: [{ description: "Test MP4", accept: { "video/mp4": [".mp4"] } }],
          });
          el.textContent = "Running";
          const source = await (await fetch("/fixtures/av.mp4")).blob();
          const originalSize = (await handle.getFile()).size;
          const result = await media(source)
            .format("mp4")
            .mode("copy")
            .run({ target: { type: "file", handle } });
          const before = await (await handle.getFile()).arrayBuffer();
          const controller = new AbortController();
          let canceled;
          try {
            await media(source)
              .format("mp4")
              .run({
                target: { type: "file", handle },
                signal: controller.signal,
                onProgress: (e) => {
                  if (e.phase === "processing") controller.abort();
                },
              });
          } catch (e) {
            canceled = { code: e.code, targetState: e.targetState };
          }
          const after = await (await handle.getFile()).arrayBuffer();
          const same =
            before.byteLength === after.byteLength &&
            new Uint8Array(before).every((v, i) => v === new Uint8Array(after)[i]);
          const info = await probe(new Blob([after]));
          const report = {
            originalSize,
            resultSize: result.size,
            actualSize: after.byteLength,
            commitState: result.commitState,
            canceled,
            originalCommittedContentPreserved: same,
            tracks: info.tracks,
            userAgent: navigator.userAgent,
          };
          el.textContent = JSON.stringify(report, null, 2);
          window.nativeResult = report;
        } catch (e) {
          el.textContent = String(e);
        }
      };
    </script>
  </body>
</html>
